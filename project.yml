name: AltSplit
options:
  bundleIdPrefix: com.adamodeven
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  AltSplit:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AltSplit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamodeven.AltSplit
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: AltSplit
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Used to take your check-in progress photo."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Used to choose a check-in photo when the camera isn't available."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID protects your check-in photos."
        INFOPLIST_KEY_NSAlarmKitUsageDescription: "Used to schedule workout and weigh-in alarms that break through silent mode."
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: AltSplit/AltSplit.entitlements
      properties:
        com.apple.developer.alarmkit: true
  AltSplitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AltSplitTests
    dependencies:
      - target: AltSplit
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.adamodeven.AltSplitTests
  AltSplitUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AltSplitUITests
    dependencies:
      - target: AltSplit
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.adamodeven.AltSplitUITests
        TEST_TARGET_NAME: AltSplit
schemes:
  AltSplit:
    build:
      targets:
        AltSplit: all
        AltSplitTests: [test]
        AltSplitUITests: [test]
    test:
      targets:
        - AltSplitTests
        - AltSplitUITests
      config: Debug
    run:
      config: Debug
